name: Tests
on:
  pull_request:

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        # 5.0: kept for AWS DocumentDB / Azure DocumentDB compatibility
        # 7.0, 8.0: current supported MongoDB releases
        mongodb-version: [ "5.0", "7.0", "8.0" ]
        pydantic-version: [ "2.11", "2.12" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-replica-set: test-rs
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install Pydantic ${{ matrix.pydantic-version }}
        run: uv pip install -U pydantic[email]==${{ matrix.pydantic-version }}
      - name: run tests
        run: uv run pytest -vvv
